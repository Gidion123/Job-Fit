[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfit"
version = "0.2.0"
description = "Evidence-grounded job matching and skill-gap analysis for early-career AI and data job seekers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gidion Depari" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
