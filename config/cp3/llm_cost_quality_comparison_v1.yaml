# Descriptive reporting only (no automatic promotion).
reporting:
  historical_reference_margin: 0.03     # D-029 rule 3 / D-066: challenger >= sol - 0.03
  materially_lower_cost_ratio: 0.5      # flag when challenger cost per valid pair <= 0.5 x Sol
  bootstrap_seed: 20261004
