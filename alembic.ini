# Alembic for the CP3 production schema (D-098). Raw-SQL revisions only, no autogenerate.
# The database URL is never stored here: migrations/env.py reads it from an explicit DATABASE_URL
# (or a programmatic config attribute) and refuses to run without one.
# An existing CP2 database is never upgraded through 0001: verify and stamp it with
#   python scripts/db_baseline.py verify|stamp
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
