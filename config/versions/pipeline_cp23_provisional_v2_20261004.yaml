# D-077 development configuration candidate. Earlier version files stay unchanged.
# K and PARTIAL weight are chosen by the D-078 rule before the D-053 freeze.
pipeline_version: pipeline-cp23-provisional-v2
based_on: config/versions/pipeline_cp23_v11_20261004.yaml
analysis_date: '2026-09-30'
schema_version: cv-v1.1-precision
guideline_version: v1.3
guideline_file: evals/annotation_guideline_v1_3.md
# Stage 1
stage1_method: hybrid_fts_dense_rrf
embedding_model: qwen3-embedding-8b
rrf_k: 60
stage1_seniority_rule: seniority-demote-3y-v1   # D-074, user can switch it off
stage1_k: 20            # provisional until D-078
# Stage 2: extraction (offline, cached)
extraction_model: deepseek-flash
jd_prompt_file: prompts/jd_extraction_v1_4_experimental.md
jd_prompt_version: jd-prompt-v1.4-experimental
jd_extraction_contract: qualification-inventory-v1
# Stage 2: evidence matching (online, per user)
matching_model: gpt-6-luna
matching_request_adaptation: D-058 RouteClient (temperature omitted, dated alias accepted)
evidence_prompt_file: prompts/evidence_matching_v1_1.md
evidence_prompt_version: evidence-prompt-v1.1
evidence_validator: quote-check-v1.1
evidence_guardrails: [G1, G2]
guardrail_g1_headings: markdown-or-plain-v1
# Runtime limits
output_policy: pipeline-v1.1-output-policy
request_timeout_seconds: 240
matching_concurrency_limit: 20
max_validation_repairs: 1
max_length_continuations: 1
# Score and order
hold_policy: H2v2                       # D-072
hold_required_fraction_max: 0.20
partial_weight: 0.5     # provisional until D-078
order: product_order_constraints_then_holds   # D-013, D-073
freeze_status: provisional_development_D077
