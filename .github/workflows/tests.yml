# CI on every push and pull request (CP3.2). No API key, no paid call: tests use fakes,
# and tests that need git-ignored local files (database, tokenizers, query cache) skip.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt ruff==0.16.8
      # Lint: syntax errors and undefined names everywhere (the codebase uses a compact style).
      - run: ruff check --select E9,F63,F7,F82 src scripts ui tests
      # Lint: all Pyflakes checks for the application code. D-087 frozen files are exempted in pyproject.toml.
      - run: ruff check --select F src ui
      # CP2 freeze: every D-087 file must still match its frozen hash (exit 2 on drift).
      - run: python scripts/prepare_cp23_freeze.py --verify evals/freeze/cp23_freeze_draft_v2
      - run: python -m pytest -q
  # Alembic 0001/0002 on a disposable pgvector service (D-098). The service and its password exist only
  # inside this job; no production database or credential is involved.
  db-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: jobfit_ci
          POSTGRES_PASSWORD: jobfit_ci
          POSTGRES_DB: jobfit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfit_ci -d jobfit_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      JOBFIT_MIGRATION_TESTS: '1'
      JOBFIT_MIGRATION_ADMIN_URL: postgresql://jobfit_ci:jobfit_ci@127.0.0.1:5432/jobfit_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_migrations_offline.py tests/test_migrations_db.py tests/test_live_db.py tests/test_live_runtime_db.py tests/test_live_restart_db.py
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t jobfit-api .
      - run: docker build -f Dockerfile.ui -t jobfit-ui .
      # The API image carries the Alembic revisions (no database needed to list them).
      - run: docker run --rm jobfit-api alembic heads | grep -q '^0002 (head)'
      # Smoke: the API image must start and answer /health with the saved demo available.
      - run: |
          docker run -d --name api -p 8000:8000 jobfit-api
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/health | grep '"saved_demo":true'
      # Persistent ledger (CP3 Phase 2): the provisioned storage root survives container replacement on a
      # named volume, and an image without the volume is unprovisioned. Proves Docker named-volume
      # persistence only, not a deployed host (Phase 8). No database, no provider, no network.
      - name: Ledger named-volume persistence smoke
        run: |
          set -eu
          L=/var/lib/jobfit/ledger/usage_ledger.jsonl
          docker volume create jobfit_ledger_smoke
          id1=$(docker run --rm -v jobfit_ledger_smoke:/var/lib/jobfit/ledger jobfit-api \
                python -m jobfit.live.storage init --ledger "$L" | python3 -c 'import json,sys; print(json.load(sys.stdin)["storage_id"])')
          echo "provisioned storage_id=$id1"
          docker run --name ledger_writer -v jobfit_ledger_smoke:/var/lib/jobfit/ledger jobfit-api python -c \
            "from pathlib import Path; from jobfit.live.common import append_durable; append_durable(Path('$L.intents.jsonl'), '{\"type\": \"intent\", \"operation_key\": \"idem:smoke\"}')"
          docker rm ledger_writer
          id2=$(docker run --rm -v jobfit_ledger_smoke:/var/lib/jobfit/ledger jobfit-api \
                python -m jobfit.live.storage check --ledger "$L" | python3 -c 'import json,sys; print(json.load(sys.stdin)["storage_id"])')
          echo "storage_id after container replacement=$id2"
          test "$id1" = "$id2"
          docker run --rm -v jobfit_ledger_smoke:/var/lib/jobfit/ledger jobfit-api cat "$L.intents.jsonl" | grep -q '"idem:smoke"'
          if docker run --rm jobfit-api python -m jobfit.live.storage check --ledger "$L" 2> no_volume.err; then
            echo "an image without the volume must not be provisioned"; exit 1
          fi
          grep -q 'missing_marker' no_volume.err
          echo "named-volume smoke ok: same storage_id, intent survived, no-volume container unprovisioned"
          docker volume rm jobfit_ledger_smoke
