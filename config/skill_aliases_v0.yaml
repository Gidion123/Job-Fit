# JobFit skill alias taxonomy v0: deterministic matching for EDA and baseline keyword overlap.
# Each canonical skill has: category, aliases (case-insensitive, word-boundary), optional regex (overrides aliases),
# optional case_sensitive. Ambiguous short names (R, Go) use restrictive regexes to avoid false matches.
version: v0
skills:
  python: {category: language, aliases: [python]}
  sql: {category: language, aliases: [sql, t-sql, pl/sql]}
  r: {category: language, regex: '(?<![\w/&])R(?![\w/&+#.-])(?=\s*(?:,|/|\)|and\b|or\b|dan\b|programming|language|studio))', case_sensitive: true}
  java: {category: language, regex: '\bjava\b(?!\s*script)'}
  scala: {category: language, aliases: [scala]}
  golang: {category: language, regex: '\bgolang\b|\bGo\b(?=\s*(?:,|/|\)|and\b|or\b|dan\b|language|developer|engineer))', case_sensitive: false}
  javascript_typescript: {category: language, aliases: [javascript, typescript, node.js, nodejs]}
  cpp: {category: language, regex: 'c\+\+'}
  machine_learning: {category: ml_concept, aliases: [machine learning, pembelajaran mesin, ml models, ml model]}
  deep_learning: {category: ml_concept, aliases: [deep learning, neural network, neural networks]}
